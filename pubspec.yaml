name: tondro
description: "Tondro - Persian download manager"
publish_to: 'none'
# market-release-ready
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  background_downloader: ^9.5.9
  receive_sharing_intent: 1.8.1
  webview_flutter: ^4.14.1
  file_picker: ^13.1.0
  home_widget: ^0.10.0
  dtorrent_task_v2: ^0.5.4
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  intl: ^0.20.3
  crypto: ^3.0.7
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
